name: CI

on: [push]

jobs:
    test:
        runs-on: ubnutu-latest

        steps:
            # Check out the code
            - name: Checkout code
              uses: actions/checkout@v4

            # Set up Python
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.13'
            
            # Install dependencies
            - name: Install dependencies
              run: pip install -r requirements.txt
            
            # Run tests
            - name: Run tests
              run: pytest tests/ -v
